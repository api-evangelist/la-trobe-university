  state: gated
  reason: no_public_api
  detail: >-
    La Trobe University publishes no institution-authored API contract. The one API host on its
    own registrable domain, api.latrobe.edu.au, is an Azure API Management developer portal whose
    every path — /apis, /developer, /.well-known/openid-configuration — redirects to /signin, so
    the catalogue behind it is not externally observable. developer.latrobe.edu.au and
    data.latrobe.edu.au do not resolve. There is no CKAN or Socrata open-data portal and no
    institution-hosted OAI-PMH responder (opal.latrobe.edu.au/oai answers HTTP 202 with an empty
    body). The remaining machine-readable surfaces are tenancies — Figshare, CourseLoop, Ex Libris
    and an AAF-managed Shibboleth IdP — and are recorded as such, with x-operator on each entry,
    rather than credited to La Trobe as its own engineering. A secondary condition worth noting
    for future runs: every www/library/policy page on latrobe.edu.au sits behind a Cloudflare
    managed challenge and answers 403 to any non-browser client, including /robots.txt,
    /llms.txt and /.well-known/security.txt, so no institutional policy or terms pointer could be
    verified and none is claimed here.
