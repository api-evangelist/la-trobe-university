apis:
  - aid: la-trobe-university:opal-figshare-rest
    name: OPAL (Open @ La Trobe) Figshare REST API
    description: >-
      OPAL is La Trobe University's institutional open-access repository, hosted on
      the Figshare platform. Figshare exposes a public, documented REST API; La Trobe's
      portal records are retrievable via the institution-scoped articles endpoint
      (institution id 234). Returns publications, theses, datasets, and educational
      resources with DOIs and Dublin Core / DataCite metadata. Verified live (HTTP 200).
    humanURL: https://docs.figshare.com/
    baseURL: https://api.figshare.com/v2
    tags: [ Repository, Open Data, Research, Figshare, REST ]
    properties:
