description: >-
  La Trobe University is a public research university headquartered in Bundoora, Melbourne,
  Victoria, Australia, founded in 1964 and ranked #217 in the QS World University Rankings 2025.
  La Trobe operates no public, self-service API product and publishes no OpenAPI, AsyncAPI or
  GraphQL description of its own. Its single institution-operated API host, api.latrobe.edu.au,
  is an Azure API Management developer portal (CNAME ltu-api-prod-apim.developer.azure-api.net)
  that redirects every unauthenticated path to /signin, with no public catalogue, documentation
  or sign-up. Everything else that looks programmable under the La Trobe name is a vendor
  platform running under an institutional tenancy: the open-access repository OPAL
  (opal.latrobe.edu.au, CNAME figshare.com) and its alias researchdata.latrobe.edu.au are
  Figshare; the course handbook (handbook.latrobe.edu.au) is CourseLoop, whose backend at
  cf-api-ap-southeast-2.prod.courseloop.com refuses unauthenticated calls; library discovery and
  resource management are Ex Libris Primo and Alma; the Shibboleth identity provider at
  aaf.latrobe.edu.au is operated by the Australian Access Federation under La Trobe's own domain,
  entityID and scope. What La Trobe genuinely holds in its own name is registry identity — a
  DataCite membership with the DOI prefix 10.26181 over 47,824 DOIs, Crossref member 11371, ROR
  01rxfrp27, and the AAF/eduGAIN SAML entity that federates its staff and students. That is the
  honest footprint: institutional identity and stewardship, not institutional engineering.
