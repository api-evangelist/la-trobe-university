  - aid: la-trobe-university:opal-figshare-oai-pmh
    name: OPAL (Open @ La Trobe) OAI-PMH Endpoint
    description: >-
      OAI-PMH metadata harvesting interface for the La Trobe OPAL repository, served
      via the Figshare platform OAI provider, scoped to the La Trobe portal set
      (portal_234) and supporting the oai_dc metadata prefix. Verified live (HTTP 200).
    humanURL: https://docs.figshare.com/#oai_pmh
    baseURL: https://api.figshare.com/v2/oai
    tags: [ OAI-PMH, Repository, Open Data, Metadata, Harvesting ]
    properties:
      - type: Documentation
        url: https://docs.figshare.com/#oai_pmh
      - type: Website
        url: https://opal.latrobe.edu.au/
  - aid: la-trobe-university:api-gateway
    name: La Trobe API Gateway (Gated)
    description: >-
      An institutional API gateway is reachable at api.latrobe.edu.au, but it is not a
      public, self-service developer product. Unauthenticated requests return HTTP 302
      redirecting to a /signin page, indicating access is restricted to authenticated
      and/or institutionally affiliated consumers. No public API documentation or
      open sign-up was found. Listed for transparency only; no endpoints are documented.
    humanURL: https://api.latrobe.edu.au/
    tags: [ Gated, Authentication, Internal, Gateway ]
    properties:
      - type: Authentication
        url: https://api.latrobe.edu.au/signin
