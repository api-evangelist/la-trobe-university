---
aid: la-trobe-university
name: La Trobe University
description: >-
  La Trobe University is a public research university based in Melbourne, Victoria,
  Australia, ranked #217 in the QS World University Rankings 2025. Like most
  universities, La Trobe does not operate a single consolidated public developer
  portal; the bulk of its API surface (an internal API gateway at api.latrobe.edu.au)
  sits behind sign-in and institutional federation. Its most clearly public,
  documented machine-readable interface is its open research repository, OPAL
  (Open @ La Trobe), which is hosted on the Figshare platform and therefore exposes
  the standard Figshare REST API and an OAI-PMH metadata endpoint for harvesting
  open-access publications, theses, and research data. Library discovery runs on
  Ex Libris Alma and Primo.
type: Index
position: Consumer
