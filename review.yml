  - date: '2026-06-03'
    rating: 2
    summary: >-
      La Trobe University has no consolidated public developer portal. The clearly
      public, documented machine interface is its OPAL open-access repository, hosted
      on Figshare, which exposes the standard Figshare REST API (institution=234) and
      an OAI-PMH endpoint (set portal_234) — both verified live and returning data.
      An institutional API gateway exists at api.latrobe.edu.au but redirects
      unauthenticated traffic to a sign-in page and is not a public, documented,
      self-service product. Library discovery runs on Ex Libris Alma/Primo. No
      fabricated endpoints: only URLs probed live or backed by registry/vendor
      documentation are recorded. Rating reflects limited but real public API maturity.
    endpoints:
      - url: https://www.latrobe.edu.au/
        status: 403
